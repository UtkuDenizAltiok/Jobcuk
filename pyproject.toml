[project]
name = "jobcu"
version = "0.0.1"
description = "A private job search app that runs on your own computer."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Utku Deniz Altiok" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "platformdirs>=4.11.9",
    "uvicorn>=0.53.0",
]

[project.scripts]
jobcu = "jobcu.launcher:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
