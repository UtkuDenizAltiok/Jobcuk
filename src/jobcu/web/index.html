<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobcu</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/static/favicon.svg" alt="" width="28" height="28">
      <span class="brand-name">Jobcu</span>
    </div>
  </header>

  <main class="page">
    <section class="welcome" aria-labelledby="welcome-title">
      <h1 id="welcome-title">Jobcu is running on your computer</h1>
      <p>Everything is set up correctly. The job search itself will appear on this page in the
        next stage of building Jobcu.</p>
      <p class="status" id="engine-status" role="status">Checking Jobcu's engine…</p>
    </section>
  </main>

  <footer class="footer">
    <p><span id="version">Jobcu</span> · <span id="copyright">© Utku Deniz Altiok. All rights reserved.</span></p>
    <p class="data-folder" id="data-folder" hidden>Your data is kept only on this computer, in
      <code id="data-folder-path"></code></p>
  </footer>
</body>
</html>
